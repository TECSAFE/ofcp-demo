name: Build and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  # No version tagging: this repo is read-only on Forgejo, so CI cannot push tags.

  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: https://github.com/pnpm/action-setup@v6
        with:
          package_json_file: api/package.json
      - uses: https://github.com/actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: api/pnpm-lock.yaml
      - name: Install api
        working-directory: api
        run: pnpm install
      - name: Unit tests
        working-directory: api
        run: pnpm jest
      - name: E2E tests
        working-directory: api
        run: pnpm jest --config ./test/jest-e2e.json

  test-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: https://github.com/pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: https://github.com/actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install ui
        working-directory: ui
        run: pnpm install
      - name: Unit tests
        working-directory: ui
        run: pnpm test

  build:
    needs: [test-api, test-ui]
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Images and layer cache go to the Forgejo registry now, not ghcr.io.
      # The script derives host and user from the runner, so there is no
      # variable to leave unset. Needs the checkout: it lives in this repo.
      - name: Log in to Forgejo registry
        id: registry
        env:
          REGISTRY_TOKEN: ${{ secrets.CI_TOKEN }}
          # The account that owns CI_TOKEN.
          REGISTRY_USER: ${{ secrets.CI_USERNAME }}
          SERVICE: ${{ github.event.repository.name }}
          ARCH: ${{ matrix.arch }}
        run: .forgejo/bin/registry-login

      # No login means nowhere to push, so stop here.
      - name: Require registry login
        if: ${{ steps.registry.outputs.enabled != 'true' }}
        run: |
          echo "::error::Forgejo registry login failed - cannot push ${{ github.event.repository.name }} (${{ matrix.arch }})."
          exit 1

      - uses: https://github.com/docker/setup-buildx-action@v4

      - name: Build and push (single arch)
        uses: https://github.com/docker/build-push-action@v7
        with:
          context: .
          target: production
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ${{ steps.registry.outputs.image }}:latest-${{ matrix.arch }}
          # Registry cache: type=gha has no backing service on the Forgejo runner.
          cache-from: ${{ steps.registry.outputs.from }}
          cache-to: ${{ steps.registry.outputs.to }}

  manifest:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Forgejo registry
        id: registry
        env:
          REGISTRY_TOKEN: ${{ secrets.CI_TOKEN }}
          REGISTRY_USER: ${{ secrets.CI_USERNAME }}
          SERVICE: ${{ github.event.repository.name }}
        run: .forgejo/bin/registry-login

      - name: Require registry login
        if: ${{ steps.registry.outputs.enabled != 'true' }}
        run: |
          echo "::error::Forgejo registry login failed - cannot create the manifest for ${{ github.event.repository.name }}."
          exit 1

      - uses: https://github.com/docker/setup-buildx-action@v4

      - name: Create multi-arch manifest
        run: |
          IMAGE="${{ steps.registry.outputs.image }}"

          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:latest-amd64" \
            "${IMAGE}:latest-arm64"

      - name: Inspect multi-arch image
        run: docker buildx imagetools inspect "${{ steps.registry.outputs.image }}:latest"
