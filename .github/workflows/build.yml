name: Build and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: api/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: api/pnpm-lock.yaml
      - name: Install api
        working-directory: api
        run: pnpm install
      - name: Unit tests
        working-directory: api
        run: pnpm jest
      - name: E2E tests
        working-directory: api
        run: pnpm jest --config ./test/jest-e2e.json

  test-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install ui
        working-directory: ui
        run: pnpm install
      - name: Unit tests
        working-directory: ui
        run: pnpm test

  build:
    needs: [test-api, test-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build and push (rolling latest)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha,scope=ofcp-demo-multi
          cache-to: type=gha,mode=max,scope=ofcp-demo-multi
