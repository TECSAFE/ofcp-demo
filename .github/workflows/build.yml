name: Build and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: api/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: api/pnpm-lock.yaml
      - name: Install api
        working-directory: api
        run: pnpm install
      - name: Unit tests
        working-directory: api
        run: pnpm jest
      - name: E2E tests
        working-directory: api
        run: pnpm jest --config ./test/jest-e2e.json

  test-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install ui
        working-directory: ui
        run: pnpm install
      - name: Unit tests
        working-directory: ui
        run: pnpm test

  build:
    needs: [test-api, test-ui]
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build and push (single arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ghcr.io/tecsafe/ofcp-demo:latest-${{ matrix.arch }}
          cache-from: type=gha,scope=ofcp-demo-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ofcp-demo-${{ matrix.arch }}

  manifest:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/tecsafe/ofcp-demo:latest \
            ghcr.io/tecsafe/ofcp-demo:latest-amd64 \
            ghcr.io/tecsafe/ofcp-demo:latest-arm64
      - name: Inspect multi-arch image
        run: docker buildx imagetools inspect ghcr.io/tecsafe/ofcp-demo:latest
