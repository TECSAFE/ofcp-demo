name: Pull-Request (Code Quality analysis & Tests)

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.changes.outputs.api }}
      ui: ${{ steps.changes.outputs.ui }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Detect changed services
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            api:
              - '.github/workflows/pr.yml'
              - 'Dockerfile'
              - 'api/**'
            ui:
              - '.github/workflows/pr.yml'
              - 'Dockerfile'
              - 'ui/**'

  security-check:
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        service: [api, ui]
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        if: ${{ needs.detect.outputs[matrix.service] == 'true' }}
        uses: pnpm/action-setup@v6
        with:
          # version comes from the service's "packageManager" field (corepack convention)
          package_json_file: ${{ matrix.service }}/package.json
      - name: Setup Node.js
        if: ${{ needs.detect.outputs[matrix.service] == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Security Check ${{ matrix.service }}
        if: ${{ needs.detect.outputs[matrix.service] == 'true' }}
        working-directory: ${{ matrix.service }}
        run: pnpm audit --prod --audit-level moderate

  lint-api:
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        if: ${{ needs.detect.outputs.api == 'true' }}
        uses: pnpm/action-setup@v6
        with:
          package_json_file: api/package.json
      - name: Setup Node.js
        if: ${{ needs.detect.outputs.api == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: api/pnpm-lock.yaml
      - name: Install api
        if: ${{ needs.detect.outputs.api == 'true' }}
        working-directory: api
        run: pnpm install
      - name: Check Linting api
        if: ${{ needs.detect.outputs.api == 'true' }}
        working-directory: api
        run: pnpm eslint "{src,test}/**/*.ts"

  test-api:
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        if: ${{ needs.detect.outputs.api == 'true' }}
        uses: pnpm/action-setup@v6
        with:
          package_json_file: api/package.json
      - name: Setup Node.js
        if: ${{ needs.detect.outputs.api == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: api/pnpm-lock.yaml
      - name: Install api
        if: ${{ needs.detect.outputs.api == 'true' }}
        working-directory: api
        run: pnpm install
      - name: Unit tests
        if: ${{ needs.detect.outputs.api == 'true' }}
        working-directory: api
        run: pnpm jest
      - name: E2E tests
        if: ${{ needs.detect.outputs.api == 'true' }}
        working-directory: api
        run: pnpm jest --config ./test/jest-e2e.json

  test-ui:
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        if: ${{ needs.detect.outputs.ui == 'true' }}
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - name: Setup Node.js
        if: ${{ needs.detect.outputs.ui == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install ui
        if: ${{ needs.detect.outputs.ui == 'true' }}
        working-directory: ui
        run: pnpm install
      - name: Unit tests
        if: ${{ needs.detect.outputs.ui == 'true' }}
        working-directory: ui
        run: pnpm test
      - name: Typecheck
        if: ${{ needs.detect.outputs.ui == 'true' }}
        working-directory: ui
        run: pnpm exec nuxt typecheck

  build-check:
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
        if: ${{ needs.detect.outputs.api == 'true' || needs.detect.outputs.ui == 'true' }}
      - name: Build image (amd64, no push)
        if: ${{ needs.detect.outputs.api == 'true' || needs.detect.outputs.ui == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: false
          provenance: false
          cache-from: type=gha,scope=ofcp-demo-amd64
          cache-to: type=gha,mode=max,scope=ofcp-demo-amd64
